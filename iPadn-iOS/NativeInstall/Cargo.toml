[package]
name = "ipadn-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "ipadn_native"
crate-type = ["staticlib", "rlib"]

[dependencies]
# Pure-Rust TLS backend: no C toolchain or Apple SDK is needed to cross-compile.
idevice = { version = "=0.1.68", default-features = false, features = [
  "rustcrypto",
  "afc",
  "installation_proxy",
  "remote_pairing",
  "rsd",
  "tcp",
  "tunnel_tcp_stack",
] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "fs", "io-util", "sync", "macros"] }
base64 = "0.22"
plist = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
