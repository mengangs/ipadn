name: Mac PKG iOS static-link feasibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'iPadn-iOS/scripts/probe_mac_pkg_ios_bridge.sh'
      - 'iPadn-iOS/scripts/mac_pkg_runtime_probe.m'
      - 'iPadn-iOS/scripts/probe_mac_pkg_ios_tci.sh'
      - 'iPadn-iOS/scripts/mac_pkg_tci_probe.m'
      - '.github/workflows/mac-pkg-ios-bridge-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-static-link:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Verify Go and iPhone SDK
        run: |
          go version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          cmake --version
      - name: Build and link Mac Store runtime probe for iPhoneOS arm64
        run: bash iPadn-iOS/scripts/probe_mac_pkg_ios_bridge.sh
      - name: Upload standalone unsigned iPhone compatibility test IPA
        uses: actions/upload-artifact@v4
        with:
          name: MacPKGProbe-unsigned-iphoneos
          path: ${{ runner.temp }}/ipadn-macpkg-static-probe/out/MacPKGProbe-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  ios-nojit-tci:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify iPhone SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          cmake --version
      - name: Build no-JIT TCI interpreter and unsigned iPhone test IPA
        run: bash iPadn-iOS/scripts/probe_mac_pkg_ios_tci.sh
      - name: Upload standalone no-JIT iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: MacPKGTCIProbe-unsigned-iphoneos
          path: ${{ runner.temp }}/ipadn-macpkg-tci-probe/out/MacPKGTCIProbe-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
