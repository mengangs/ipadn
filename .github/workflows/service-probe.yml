name: Inspect public login and update responses
on:
  push:
    branches: [fix/login-bag-and-updates]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public endpoints without account credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, plistlib, json
          from pathlib import Path
          from urllib.parse import urlsplit
          urls = {
            'bag': 'https://init.itunes.apple.com/bag.xml?guid=AABBCCDDEEFF',
            'release-api': 'https://api.github.com/repos/mengangs/ipadn/releases/latest',
            'release-feed': 'https://github.com/mengangs/ipadn/releases.atom'
          }
          for name, url in urls.items():
              headers = {'User-Agent': 'Configurator/2.17 (Macintosh; OS X 15.2; 24C5089c) AppleWebKit/0620.1.16.11.6', 'Accept': 'application/xml'} if name == 'bag' else {'User-Agent': 'iPadn/1.7.4', 'Accept': 'application/vnd.github+json' if name == 'release-api' else 'application/atom+xml'}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                      data = response.read()
                      print(name, 'HTTP', response.status, 'type', response.headers.get('Content-Type'), 'bytes', len(data))
                  if name == 'bag':
                      Path('/tmp/ipadn-bag.xml').write_bytes(data)
                      print('bag XML prefix:', data[:700].decode(errors='replace'))
                      raw = plistlib.loads(data)
                      print('bag root type', type(raw).__name__, 'root keys', list(raw)[:25])
                      bag = raw.get('urlBag', raw)
                      print('authenticateAccount:', bag.get('authenticateAccount'))
                      for key in ['sign-sap-setup', 'sign-sap-setup-cert', 'sign-sap-version']:
                          print(key, bag.get(key))
                  elif name == 'release-api':
                      print('release tag', json.loads(data).get('tag_name'))
                  else:
                      Path('/tmp/ipadn-releases.atom').write_bytes(data)
                      print('feed sample:', data[:2300].decode(errors='replace'))
              except Exception as e:
                  print(name, type(e).__name__, str(e)[:180])
          PY
          cat > /tmp/probe.swift <<'SWIFT'
          import Foundation
          let data = try Data(contentsOf: URL(fileURLWithPath: "/tmp/ipadn-bag.xml"))
          do {
              let raw = try PropertyListSerialization.propertyList(from: data, format: nil)
              print("Foundation root:", type(of: raw))
              if let raw = raw as? [String: Any] {
                  print("Foundation root keys:", raw.keys.sorted().prefix(25))
                  if let bag = raw["urlBag"] as? [String: Any] {
                      print("Foundation authenticateAccount:", bag["authenticateAccount"] ?? "missing")
                  }
              }
          } catch { print("Foundation parsing error:", (error as NSError).domain, (error as NSError).code) }
          SWIFT
          swift /tmp/probe.swift
          cat iPadn-iOS/iPadn/Services/ApplePropertyList.swift > /tmp/fixed-probe.swift
          cat >> /tmp/fixed-probe.swift <<'SWIFT'
          let data = try Data(contentsOf: URL(fileURLWithPath: "/tmp/ipadn-bag.xml"))
          let raw = try ApplePropertyList.dictionary(data)
          let bag = raw["urlBag"] as? [String: Any] ?? raw
          guard let address = bag["authenticateAccount"] as? String, let url = URL(string: address),
                url.host == "buy.itunes.apple.com" else { fatalError("Actual Apple bag could not be decoded") }
          print("PASS: actual Apple Document/Protocol bag decoded; authentication endpoint host:", url.host!)
          SWIFT
          swift /tmp/fixed-probe.swift
