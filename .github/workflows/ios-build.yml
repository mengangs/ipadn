name: Build iPadn

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run iOS Simulator unit tests
        required: true
        default: true
        type: boolean
      publish_release:
        description: Publish a GitHub Release after all build, test and screenshot checks pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: iPadn-iOS
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode and report SDK
        run: |
          # The macos-15 runner no longer has an iOS 18.2 simulator runtime.
          # Xcode 16.2's asset catalog compiler fails even for device builds.
          # Xcode 26.0.1 is known to build this project successfully on this runner.
          if [ -d /Applications/Xcode_26.0.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          elif [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          else
            echo 'No compatible Xcode installation found on this macOS runner' >&2
            exit 1
          fi
          xcodebuild -version
          xcodebuild -showsdks
          mkdir -p build
          # Use an available simulator for the selected SDK, not a hard-coded model.
          python3 - <<'PY'
          import json, os, subprocess
          sdk = subprocess.check_output(
              ['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version'], text=True
          ).strip()
          runtimes = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devices', 'available', '--json'], text=True
          ))['devices']
          devices = [
              (runtime, device) for runtime, values in runtimes.items()
              if '.iOS-' in runtime
              for device in values
              if device.get('isAvailable') and device['name'].startswith('iPhone')
          ]
          if not devices:
              raise SystemExit('No compatible iOS simulator found for selected Xcode')
          preferred = 'iOS-' + sdk.replace('.', '-')
          devices.sort(key=lambda entry: (
              preferred not in entry[0],
              entry[1]['state'] != 'Booted',
              not entry[1]['name'].endswith('Pro'),
              entry[1]['name'],
          ))
          runtime, device = devices[0]
          print('Selected simulator:', runtime, device['name'], device['udid'])
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('SIMULATOR_ID=' + device['udid'] + '\n')
          PY

      - name: Verify project and repository-local runtime
        run: |
          python3 scripts/assemble_runtime.py
          python3 scripts/verify_project.py
          node scripts/runtime_smoke_test.cjs

      - name: Build unsigned device IPA
        run: |
          set -o pipefail
          bash scripts/build_unsigned_ipa.sh 2>&1 | tee build/build.log
          python3 scripts/verify_ipa.py build/iPadn-unsigned.ipa
          shasum -a 256 build/iPadn-unsigned.ipa > build/iPadn-unsigned.ipa.sha256
          python3 - <<'PY'
          import json, os, subprocess, plistlib, zipfile
          from pathlib import Path
          with zipfile.ZipFile('build/iPadn-unsigned.ipa') as ipa:
              info = plistlib.loads(ipa.read('Payload/iPadn.app/Info.plist'))
          Path('build/build-info.json').write_text(json.dumps({
              'version': info['CFBundleShortVersionString'],
              'build': info['CFBundleVersion'],
              'commit': os.environ['GITHUB_SHA'],
              'run': os.environ['GITHUB_RUN_ID'],
              'xcode': subprocess.check_output(['xcodebuild', '-version'], text=True).strip(),
              'minimum_ios': '17.0',
              'signed': False,
              'note': 'Sign with your own tool before installing.'
          }, indent=2) + '\n')
          PY

      - name: Upload IPA
        id: ipa
        uses: actions/upload-artifact@v4
        with:
          name: iPadn-unsigned-ipa
          path: |
            iPadn-iOS/build/iPadn-unsigned.ipa
            iPadn-iOS/build/iPadn-unsigned.ipa.sha256
            iPadn-iOS/build/build-info.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Run simulator unit tests
        timeout-minutes: 12
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        run: |
          set -o pipefail
          killall -9 com.apple.CoreSimulator.CoreSimulatorService || true
          xcodebuild test -project iPadn.xcodeproj -scheme iPadn \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 90 -maximum-test-execution-time-allowance 120 \
            -destination-timeout 120 -derivedDataPath build/TestDerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee build/tests.log
          xcrun xcresulttool get test-results summary --path build/TestResults.xcresult --format json > build/test-summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('build/test-summary.json').read_text())
          assert result['passedTests'] > 0, 'No passing tests were executed'
          assert result['failedTests'] == 0, 'Tests failed'
          print('Executed tests:', result['passedTests'], 'passed;', result['skippedTests'], 'skipped')
          PY

      - name: Upload test summary
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.run_tests)
        uses: actions/upload-artifact@v4
        with:
          name: iPadn-test-summary
          path: |
            iPadn-iOS/build/test-summary.json
            iPadn-iOS/build/ipa-verification.json
          if-no-files-found: error
          retention-days: 14

      - name: Capture running app screenshots
        timeout-minutes: 10
        if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.run_tests)
        run: |
          if [ ! -d build/TestDerivedData/Build/Products/Debug-iphonesimulator/iPadn.app ]; then exit 0; fi
          # XCTest can leave CoreSimulator unresponsive after shutting down its UI-test clone.
          # Restart this job's service before selecting and booting the screenshot device.
          killall -9 com.apple.CoreSimulator.CoreSimulatorService || true
          simulator_id="$SIMULATOR_ID"
          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl install "$simulator_id" build/TestDerivedData/Build/Products/Debug-iphonesimulator/iPadn.app
          mkdir -p build/screenshots/native
          xcrun simctl status_bar "$simulator_id" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          capture() {
            screenshot_name="$1"
            shift
            xcrun simctl launch --terminate-running-process "$simulator_id" app.local.iPadn --visual-preview "$@"
            sleep 3
            xcrun simctl io "$simulator_id" screenshot "build/screenshots/native/$screenshot_name.png"
          }
          capture discover-light
          capture discover-dark --dark
          capture downloads --downloads
          capture downloads-large-text --downloads --large-text
          capture login --login
          capture app-detail --detail
          capture accounts --accounts
          capture purchased --purchased
          capture archived-name --archive

      - name: Export interface screenshots
        if: always() && !cancelled()
        run: |
          if [ -d build/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path build/TestResults.xcresult --output-path build/screenshots
          fi

      - name: Upload interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPadn-interface-screenshots
          path: iPadn-iOS/build/screenshots
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPadn-build-diagnostics
          path: |
            iPadn-iOS/build/*.log
            iPadn-iOS/build/test-summary.json
            iPadn-iOS/build/ipa-verification.json
            iPadn-iOS/build/TestResults.xcresult
            iPadn-iOS/build/verification.json
          if-no-files-found: warn
          retention-days: 14

      - name: Write download summary
        if: always() && steps.ipa.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.ipa.outputs.artifact-url }}
        run: |
          {
            echo '## iPadn'
            echo
            echo "[下载未签名 IPA]($ARTIFACT_URL)"
            echo
            echo '下载后用自己的工具签名。无需向 GitHub 上传 Apple 账号、证书或私钥。'
            echo '登录、真实下载授权和最终安装仍需要真机验收。'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.run_tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: iPadn-unsigned-ipa
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: iPadn-test-summary
          path: release
      - name: Verify and prepare release assets
        id: release
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          root = Path('release')
          info = json.loads((root / 'build-info.json').read_text())
          tests = json.loads((root / 'test-summary.json').read_text())
          verification = json.loads((root / 'ipa-verification.json').read_text())
          assert info['commit'] == os.environ['EXPECTED_COMMIT'], 'Source commit mismatch'
          assert not info['signed'] and verification['passed'], 'Invalid unsigned IPA'
          assert tests['passedTests'] > 0 and tests['failedTests'] == 0, 'Tests did not pass'
          version = info['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version), 'Invalid release version'
          assert verification['version'] == version and verification['build'] == info['build']
          ipa = root / 'iPadn-unsigned.ipa'
          digest = hashlib.sha256(ipa.read_bytes()).hexdigest()
          assert digest == (root / 'iPadn-unsigned.ipa.sha256').read_text().split()[0], 'IPA checksum mismatch'
          asset = ipa.with_name('iPadn-' + version + '-unsigned.ipa')
          ipa.rename(asset)
          (root / (asset.name + '.sha256')).write_text(digest + '  ' + asset.name + '\n')
          notes = Path('RELEASE_NOTES.md').read_text()
          notes += '\n验证：设备 Release 编译与 IPA 检查通过；' + str(tests['passedTests']) + ' 项测试通过，' + str(tests['failedTests']) + ' 项失败，' + str(tests['skippedTests']) + ' 项跳过；模拟器截图步骤通过。\n'
          (root / 'notes.md').write_text(notes)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=v' + version + '\n')
              output.write('asset=' + str(asset) + '\n')
          PY
      - name: Publish tested unsigned IPA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        run: |
          gh release create "$RELEASE_TAG" "$RELEASE_ASSET" "$RELEASE_ASSET.sha256" release/build-info.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "iPadn $RELEASE_TAG" \
            --notes-file release/notes.md --latest
