<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SAP 签名</title>
  <style>
    :root {
      color-scheme: light dark;
      --accent: #5b6cff;
      --accent-light: #8c78ff;
      --text: #15151a;
      --secondary: rgba(21, 21, 26, .56);
      --card: rgba(255, 255, 255, .72);
      --stroke: rgba(255, 255, 255, .8);
      --shadow: rgba(53, 49, 98, .16);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      color: var(--text);
      background: linear-gradient(
        145deg,
        #d9e4e2 0%,
        #ceddd8 36%,
        #e2d9cb 72%,
        #d4ddd5 100%
      );
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
      animation: drift 9s ease-in-out infinite alternate;
    }

    body::before {
      top: -260px;
      right: -230px;
      background: rgba(239, 230, 216, .42);
    }

    body::after {
      bottom: -290px;
      left: -220px;
      background: rgba(187, 214, 208, .38);
      animation-delay: -3s;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(100%, 360px);
      padding: 42px 30px 34px;
      text-align: center;
      border: 1px solid var(--stroke);
      border-radius: 30px;
      background: var(--card);
      box-shadow: 0 24px 70px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .7);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      backdrop-filter: blur(24px) saturate(150%);
    }

    .mark {
      position: relative;
      width: 88px;
      height: 88px;
      margin: 0 auto 26px;
      display: grid;
      place-items: center;
    }

    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 20deg, transparent 0 18%, var(--accent) 42%, var(--accent-light) 75%, transparent 94%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 0);
      mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 0);
      animation: spin 1.15s linear infinite;
    }

    .icon {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      color: white;
      background: linear-gradient(145deg, var(--accent-light), var(--accent));
      box-shadow: 0 12px 28px rgba(91, 108, 255, .32);
    }

    .icon svg { width: 32px; height: 32px; }

    h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -.3px;
    }

    p {
      margin: 10px auto 0;
      max-width: 240px;
      color: var(--secondary);
      font-size: 14px;
      line-height: 1.5;
    }

    .progress {
      height: 4px;
      margin-top: 28px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(91, 108, 255, .12);
    }

    .progress::after {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), #9b79ff);
      animation: loading 1.45s ease-in-out infinite;
    }

    body.failed .ring,
    body.failed .progress { display: none; }
    body.failed .icon {
      background: linear-gradient(145deg, #ff6b61, #e53935);
      box-shadow: 0 12px 28px rgba(229, 57, 53, .28);
    }
    body.failed #detail {
      max-width: 290px;
      color: #d33131;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes loading {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(340%); }
    }
    @keyframes drift { to { transform: translate3d(18px, 16px, 0) scale(1.08); } }

    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f7f7fa;
        --secondary: rgba(235, 235, 245, .58);
        --card: rgba(28, 28, 34, .74);
        --stroke: rgba(255, 255, 255, .11);
        --shadow: rgba(0, 0, 0, .42);
      }
      body {
        background: linear-gradient(
          145deg,
          #111827 0%,
          #1b2c41 38%,
          #2f2631 73%,
          #18252d 100%
        );
      }
      body::before { background: rgba(87, 112, 145, .24); }
      body::after { background: rgba(115, 76, 105, .22); }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <div class="ring"></div>
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H6.8A1.8 1.8 0 0 0 5 4.8v14.4A1.8 1.8 0 0 0 6.8 21h10.4a1.8 1.8 0 0 0 1.8-1.8V8z" />
          <path d="M14 3v5h5" />
          <path d="m9 16 6.7-6.7a1.4 1.4 0 0 1 2 2L11 18l-3 .7z" />
        </svg>
      </div>
    </div>
    <h1 id="status">正在准备签名</h1>
    <p id="detail">正在初始化安全签名环境，请稍候</p>
    <div class="progress" aria-hidden="true"></div>
  </main>

  <script src="./sap-signer.js"></script>
  <script>
    const isKBSync = location.hash === "#kbsync"
      || new URLSearchParams(location.search).get("mode") === "kbsync";

    window.setSigningStatus = (message, detail) => {
      document.getElementById("status").textContent = message;
      if (detail) document.getElementById("detail").textContent = detail;
    };

    window.setSigningError = error => {
      document.body.classList.add("failed");
      document.getElementById("status").textContent = isKBSync ? "下载初始化失败" : "签名失败";
      document.getElementById("detail").textContent = error;
    };

    if (isKBSync) {
      document.title = "初始化下载";
      setSigningStatus("初始化下载，请稍等", "正在准备下载所需数据，请勿关闭页面");
    }

    // loadURL 完成不代表新展示的 WebView 已绘制。同步 WASM 执行前
    // 等待两个动画帧，再让出一次任务，确保进度界面先显示出来。
    window.waitForDownloadPaint = () => new Promise((resolve, reject) => {
      const timeout = setTimeout(() => reject(new Error("下载初始化页面未能完成绘制")), 5000);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        setTimeout(() => {
          clearTimeout(timeout);
          const status = document.getElementById("status");
          const bounds = status.getBoundingClientRect();
          if (document.visibilityState !== "visible" || bounds.width <= 0 || bounds.height <= 0) {
            reject(new Error("下载初始化页面不可见"));
            return;
          }
          resolve(true);
        }, 25);
      }));
    });
  </script>
</body>
</html>
