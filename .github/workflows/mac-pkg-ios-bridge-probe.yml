name: Mac PKG iOS static-link feasibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'iPadn-iOS/scripts/probe_mac_pkg_ios_bridge.sh'
      - '.github/workflows/mac-pkg-ios-bridge-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-static-link:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Verify Go and iPhone SDK
        run: |
          go version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          cmake --version
      - name: Build and link Mac Store runtime probe for iPhoneOS arm64
        run: bash iPadn-iOS/scripts/probe_mac_pkg_ios_bridge.sh
