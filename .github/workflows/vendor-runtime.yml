name: Vendor runtime once
on:
  push:
    paths: ['.github/workflows/vendor-runtime.yml']
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and vendor runtime
        run: |
          python3 IPATool-iOS/scripts/assemble_runtime.py
          mkdir -p IPATool-iOS/vendor/SAPRuntime/files
          cp IPATool-iOS/IPATool/Resources/SAPRuntime/* IPATool-iOS/vendor/SAPRuntime/files/
          git add -f IPATool-iOS/vendor/SAPRuntime/files
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Vendor verified runtime in this repository [skip ci]'
          git push
