name: Mac PKG iOS static-link feasibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'iPadn-iOS/scripts/probe_mac_pkg_ios_bridge.sh'
      - 'iPadn-iOS/scripts/mac_pkg_runtime_probe.m'
      - 'iPadn-iOS/scripts/probe_mac_pkg_ios_tci.sh'
      - 'iPadn-iOS/scripts/probe_mac_pkg_tci_go_bridge.sh'
      - 'iPadn-iOS/scripts/mac_pkg_tci_probe.m'
      - 'iPadn-iOS/scripts/mac_pkg_tci_host_smoke.c'
      - 'iPadn-iOS/scripts/mac_pkg_tci_go_probe.m'
      - 'iPadn-iOS/scripts/benchmark_storeagent_tci_host.sh'
      - 'iPadn-iOS/scripts/ipatool-host-benchmark.patch'
      - '.github/workflows/mac-pkg-ios-bridge-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-static-link:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Verify Go and iPhone SDK
        run: |
          go version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          cmake --version
      - name: Build and link Mac Store runtime probe for iPhoneOS arm64
        run: bash iPadn-iOS/scripts/probe_mac_pkg_ios_bridge.sh
      - name: Upload standalone unsigned iPhone compatibility test IPA
        uses: actions/upload-artifact@v4
        with:
          name: MacPKGProbe-unsigned-iphoneos
          path: ${{ runner.temp }}/ipadn-macpkg-static-probe/out/MacPKGProbe-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  ios-nojit-tci:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Verify iPhone SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          cmake --version
      - name: Build no-JIT TCI interpreter and unsigned iPhone test IPA
        run: bash iPadn-iOS/scripts/probe_mac_pkg_ios_tci.sh
      - name: Run native macOS TCI StoreAgent-style memory and code-hook regression
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/ipadn-macpkg-tci-probe"
          cmake -S "$ROOT/source" -B "$ROOT/build-host" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DUNICORN_ARCH=x86 -DUNICORN_INTERPRETER=ON \
            -DUNICORN_BUILD_TESTS=OFF -DUNICORN_INSTALL=OFF
          cmake --build "$ROOT/build-host" --parallel 4
          clang -I"$ROOT/source/include" \
            iPadn-iOS/scripts/mac_pkg_tci_host_smoke.c \
            -Wl,-force_load,"$ROOT/build-host/libunicorn.a" \
            -liconv -lz -lc++ -o "$ROOT/out/MacPKGTCIHostSmoke"
          "$ROOT/out/MacPKGTCIHostSmoke"
      - name: Static-link ipatool Go StoreAgent against no-JIT TCI for iPhoneOS
        run: bash iPadn-iOS/scripts/probe_mac_pkg_tci_go_bridge.sh
      - name: Upload standalone Go and no-JIT TCI integration IPA
        uses: actions/upload-artifact@v4
        with:
          name: MacPKGGoTCIProbe-unsigned-iphoneos
          path: ${{ runner.temp }}/ipadn-macpkg-tci-probe/out/MacPKGGoTCIProbe-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload standalone no-JIT iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: MacPKGTCIProbe-unsigned-iphoneos
          path: ${{ runner.temp }}/ipadn-macpkg-tci-probe/out/MacPKGTCIProbe-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  storeagent-tci-benchmark:
    # Real Apple StoreAgent/SAP code on the CI host: pinned JIT Unicorn vs the
    # no-JIT TCI interpreter used by the iPhone diagnostics. No Apple account.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Time real StoreAgent kbsync on JIT and TCI Unicorn
        run: bash iPadn-iOS/scripts/benchmark_storeagent_tci_host.sh
      - name: Upload timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StoreAgent-TCI-benchmark
          path: ${{ runner.temp }}/ipadn-storeagent-bench/out/*.json
          if-no-files-found: warn
          retention-days: 14
